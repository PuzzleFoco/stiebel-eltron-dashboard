name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo-/YAML-Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Strategie-Bundle ist aktuell
        run: python scripts/build_strategy.py --check

      - name: Strategie-Abnahmetest (zwei simulierte Anlagen)
        run: node scripts/test_strategy.mjs

      - name: Jinja-Makros (Sentinel, Degradation, Tabellenzeilen)
        run: python scripts/test_macros.py

      - name: Repository-Gerüst validieren
        run: python scripts/validate.py

      - name: Jinja-Blöcke sind synchron zu templates/jinja/
        run: python scripts/sync_jinja.py --check

      - name: dist/ ist synchron zu dashboards/
        run: python scripts/sync_dist.py --check

      - name: YAML linten
        run: yamllint -c .yamllint.yml dashboards dist .yamllint.yml

  actionlint:
    name: Workflow-Syntax (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output actionlint.tar.gz "$url"
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint -color

  ha-parse:
    name: HA-Loader-Check (echtes Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Home Assistant installieren
        run: python -m pip install --disable-pip-version-check homeassistant

      - name: Dashboard-YAML mit HA-Loader prüfen
        run: python scripts/check_ha_parse.py

      - name: Abnahmetest (zwei simulierte Anlagen)
        run: python scripts/render_test.py

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # "brands" gilt nur für Integrationen (home-assistant/brands).
          ignore: brands
