name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, für den das Release gebaut wird (z. B. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (vollständige Historie für Release-Notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Version aus Tag bestimmen
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG_NAME' ist keine Version im Format vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Geplante Version: $version"

      - name: Repository validieren
        run: python scripts/validate.py

      - name: Release-Artefakt bauen
        run: python scripts/build_release.py --version "${{ steps.version.outputs.version }}"

      - name: Artefakt prüfen
        run: |
          set -euo pipefail
          ls -l release/
          unzip -l "release/stiebel-eltron-dashboard-v${{ steps.version.outputs.version }}.zip"
          # Schutz: kein Release-Asset, das wie der HACS-Einstiegspunkt heißt.
          # Sonst lädt HACS nur diese eine Datei und die Dashboard-YAML fehlt.
          if compgen -G "release/*.js" > /dev/null; then
            echo "::error::Release darf keine .js-Datei als Asset enthalten"
            exit 1
          fi

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/stiebel-eltron-dashboard-v${{ steps.version.outputs.version }}.zip
            release/SHA256SUMS.txt
