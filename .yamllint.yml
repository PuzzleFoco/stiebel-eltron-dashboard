---
# yamllint-Konfiguration für Dashboard-YAML.
# .github/workflows/* wird nicht mit yamllint geprüft (dort läuft actionlint).
extends: default

ignore: |
  .github/
  release/

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
