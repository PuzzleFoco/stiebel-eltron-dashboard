---
# yamllint-Konfiguration für Dashboard-YAML.
# .github/workflows/* wird nicht mit yamllint geprüft (dort läuft actionlint).
extends: default

ignore: |
  .github/
  release/

rules:
  line-length:
    # Markdown-Tabellenzeilen und Jinja-Aufrufe in den Karten sind nicht
    # umbrechbar; 120 Zeichen sind für `dashboards/includes/cards/` zu eng.
    max: 300
    allow-non-breakable-words: true
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
