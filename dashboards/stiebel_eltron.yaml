# Stiebel Eltron Dashboard — Einstiegspunkt
#
# Quelle: dieses Repository. Auslieferung an HACS: dist/stiebel_eltron.yaml
# (byte-genau gespiegelt, siehe scripts/sync_dist.py).
#
# Aufbau:
#   * includes/views/*.yaml   — je eine View, per !include eingebunden
#   * includes/cards/*.yaml   — Karten und auto-entities-Vorlagen
#   * templates/jinja/*.j2    — kanonische Makros, per scripts/sync_jinja.py
#                               in die Karten kopiert (nicht in dist/)
#
# Pfad-Annahme: Das Dashboard ist in configuration.yaml unter dem Schlüssel
# `stiebel-eltron` registriert (siehe README). Die Markdown-Links in den
# Karten (/stiebel-eltron/geraete, /stiebel-eltron/bedienung) setzen das voraus.
title: Stiebel Eltron
views:
  - !include includes/views/uebersicht.yaml
  - !include includes/views/geraete.yaml
  - !include includes/views/bedienung.yaml
