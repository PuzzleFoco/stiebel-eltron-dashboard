type: custom:auto-entities
card:
  type: grid
  columns: 2
  square: false
card_param: cards
unique: entity
show_empty: false
filter:
  include:
    - domain: number
      entity_id: '/_(komforttemperatur|ecotemperatur|steigung_heizkurve|tagbetrieb_temperatursoll_hk_1|absenkbetrieb_temperatursoll_hk_1|heizkurve_steilheit_hk_1|comfort_temperature_target_hk1|eco_temperature_target_hk1|heating_curve_rise_hk1)(_[0-9]+)?$/'
      or:
        - label: stiebel_eltron
        - integration: stiebel_eltron_isg
      options:
        type: tile
        features:
          - type: numeric-input
            style: buttons
  exclude:
    - integration: stiebel_eltron_http
else:
  type: markdown
  content: |
    _Keine Heizungs-Sollwerte gefunden._ Erwartet werden `number`-Entitäten wie `*_komforttemperatur`, `*_ecotemperatur` oder `*_steigung_heizkurve` (ISG: `*_tagbetrieb_temperatursoll_hk_1` usw.). Eine rein lesende Anbindung (HTTP) bietet sie nicht.
